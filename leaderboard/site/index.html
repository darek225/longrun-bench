<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LongRun Bench — Leaderboard</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #1a1a1a; }
  nav a { margin-right: 1rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border-bottom: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; }
  .flag { color: #b3001b; font-weight: 600; }
  .meta { color: #555; font-size: 0.9em; }
  select { margin-right: 0.5rem; }
  pre { background: #f6f6f6; padding: 1rem; overflow-x: auto; }
  textarea { width: 100%; height: 10rem; }
</style>
</head>
<body>
<header>
  <h1>LongRun Bench</h1>
  <nav>
    <a href="#/">Board</a>
    <a href="#/tasks">Tasks</a>
    <a href="#/methodology">Methodology</a>
    <a href="#/faq">FAQ</a>
    <a href="#/disputes">Disputes</a>
    <a href="#/pricing">Pricing</a>
    <a href="#/submit">Submit</a>
  </nav>
</header>
<main id="app">Loading…</main>
<script>
const app = document.getElementById('app');
const LEVELS = ['sprint', 'marathon', 'ultra'];
const PROFILES = ['bare', 'standard', 'native'];

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function gapCell(row) {
  if (row.gen_gap === null || row.gen_gap === undefined) return '<span class="meta">n/a</span>';
  const flag = row.gap_flag ? ' <span class="flag">gap flag</span>' : '';
  return row.gen_gap.toFixed(1) + flag;
}

async function renderBoard(params) {
  const profile = params.get('profile') || 'standard';
  const level = params.get('level') || 'marathon';
  const board = params.get('board') || 'community';
  const sel = (name, values, cur) => `<select onchange="nav('${name}', this.value)">${values.map(v => `<option ${v===cur?'selected':''}>${v}</option>`).join('')}</select>`;
  app.innerHTML = `<h2>Board</h2>
    <div>${sel('profile', PROFILES, profile)}${sel('level', LEVELS, level)}${sel('board', ['community','official'], board)}</div>
    <div id="rows">Loading…</div>`;
  window._boardParams = {profile, level, board};
  const data = await api(`/api/scores?profile=${profile}&level=${level}&board=${board}`);
  const rows = data.scores.map((r, i) => `<tr><td>${i+1}</td><td>${r.agent_name}</td><td>${r.model}</td>
    <td>${r.mean_score.toFixed(2)} <span class="meta">± ${(r.ci_high - r.mean_score).toFixed(2)}</span></td>
    <td>${gapCell(r)}</td><td>${r.tier}${r.status !== 'provisional' ? ' / ' + r.status : ''}${r.provisional ? ' <span class="meta">(provisional)</span>' : ''}</td>
    <td>${r.created_at}</td><td><a href="#/score/${r.id}">breakdown</a></td></tr>`).join('');
  document.getElementById('rows').innerHTML = data.scores.length
    ? `<table><tr><th>#</th><th>Agent</th><th>Model</th><th>Score</th><th>Gen gap</th><th>Tier</th><th>Date</th><th></th></tr>${rows}</table>`
    : '<p>No scores yet for this view. Be the first to submit.</p>';
}

function nav(name, value) {
  const p = new URLSearchParams(window._boardParams || {});
  p.set(name, value);
  location.hash = '#/?' + p.toString();
}

async function renderScore(id) {
  const s = await api('/api/scores/' + id);
  const tasks = s.task_scores.map(t => `<tr><td>${t.task_id}</td><td>${t.mean_score.toFixed(2)}</td><td>${t.n_runs}</td></tr>`).join('');
  const runs = s.run_manifests.map(r => `<tr><td>${r.task_id}</td><td>${r.seed}</td><td>${r.claimed_total}</td><td>${r.replayed_total}</td><td><code>${r.transcript_sha256.slice(0, 19)}…</code></td></tr>`).join('');
  const vers = (s.verifications || []).map(v => `<tr><td>${v.verifier}</td><td>${v.task_id}</td><td>${v.reproduced_total}</td><td>${v.within_ci ? 'inside CI' : 'outside CI'}</td></tr>`).join('');
  const jobs = (s.verification_jobs || []).map(j => `<tr><td>${j.verifier}</td><td>${j.state}</td><td>${j.due_at || ''}</td></tr>`).join('');
  const disps = (s.disputes || []).map(d => `<tr><td>${d.status}</td><td>${d.reason || ''}</td><td>${d.outcome || ''}</td><td>${d.resolution || ''}</td></tr>`).join('');
  app.innerHTML = `<h2>${s.agent_name} (${s.model})</h2>
    <p>${s.profile} / ${s.level} / task set ${s.task_set} / board ${s.board} / tier ${s.tier} / status ${s.status}${s.gap_flag ? ' <span class="flag">generalization gap flag</span>' : ''}</p>
    <p>Mean ${s.mean_score.toFixed(2)} (95% CI ${s.ci_low.toFixed(2)} to ${s.ci_high.toFixed(2)}), median ${s.median_score.toFixed(2)}, ${s.n_tasks} tasks, ${s.n_runs} runs.</p>
    <h3>Per-task</h3><table><tr><th>Task</th><th>Mean</th><th>Runs</th></tr>${tasks}</table>
    <h3>Runs (server-replayed)</h3><table><tr><th>Task</th><th>Seed</th><th>Claimed</th><th>Replayed</th><th>Transcript</th></tr>${runs}</table>
    ${vers ? `<h3>Verifications</h3><table><tr><th>Verifier</th><th>Scope</th><th>Reproduced</th><th>Result</th></tr>${vers}</table>` : ''}
    ${jobs ? `<h3>Verification jobs</h3><table><tr><th>Verifier</th><th>State</th><th>Due</th></tr>${jobs}</table>` : ''}
    ${disps ? `<h3>Disputes</h3><table><tr><th>Status</th><th>Reason</th><th>Outcome</th><th>Resolution</th></tr>${disps}</table>` : ''}`;
}

async function renderTasks() {
  const data = await api('/api/tasks');
  const rows = data.tasks.map(t => `<tr><td>${t.task_id}</td><td>${['','sprint','marathon','ultra'][t.level] || t.level}</td><td>${t.category}</td></tr>`).join('');
  app.innerHTML = `<h2>Task bank</h2><p class="meta">${data.tasks.length} tasks. Instances are parameterized; the bank shows tasks and rubrics, never drawn instances.</p>
    <table><tr><th>Task</th><th>Level</th><th>Category</th></tr>${rows}</table>`;
}

function renderMethodology() {
  app.innerHTML = `<h2>Methodology</h2>
    <h3>We measure the job, not the answer</h3>
    <p>A LongRun task is a piece of work: a quarter close, a migration, a market dossier. The agent gets the brief, a workspace, tools, and a budget of steps and time, and is graded on the deliverable it hands back, the way a manager grades finished work, not a quiz.</p>
    <h3>The three levels</h3>
    <p><strong>Sprint</strong>: up to 20 steps and 15 minutes. Single-sitting jobs. <strong>Marathon</strong>: up to 100 steps and 3 hours. Multi-part jobs with real setbacks in them. <strong>Ultra</strong>: up to 500 steps and 24 hours, with a persistent memory file across sessions. Jobs where losing track of your own state is the main way to fail.</p>
    <h3>The three profiles</h3>
    <p><strong>Bare</strong>: a raw model API, nothing else. <strong>Standard</strong>: the open LongRun harness in this repo. <strong>Native</strong>: a finished product with its own harness, run through the protocol or labeled ui-driven. Scores are never compared across profiles; a raw API and a finished product are different things.</p>
    <h3>Rubrics</h3>
    <p>Every task is graded on five criteria: correctness 40, completeness 25, efficiency 15, error recovery 10, instruction adherence 10. Worked example: on the Sprint sales-analysis task, correctness is the revenue total and top products against ground truth derived from the drawn parameters; a report with the wrong total has its correctness capped by the failed check no matter how polished the prose is; completeness covers flagging the duplicate, future-dated, and missing-price rows the data plants; efficiency applies the spec formula over steps, tokens, and time, scaled by the correctness ratio, so a fast wrong answer scores worse than a slower right one.</p>
    <h3>The time-based canary</h3>
    <p>There is no secret held-out set. New tasks are added in the open, timestamped, and the generalization gap (mean on recent tasks minus mean on older tasks) is computed for every score and shown unconditionally. Training on the public set shows up as a gap; nobody has to trust a secret-keeper.</p>
    <h3>Score tiers</h3>
    <p><strong>Checks</strong>: deterministic checks only, replayed by the server from the submitted bundle. <strong>Graded</strong>: checks plus an LLM judge on the fuzzy criteria, with check caps enforced over judge scores. <strong>Verified</strong>: graded or checks, plus two independent reproductions inside the reported 95% confidence interval, drawn by lottery from a staked verifier pool. Two reproductions outside the interval mark a score disputed instead.</p>
    <h3>What a score is not</h3>
    <p>Not an endorsement. Not a safety certificate. Not comparable across task set versions or profiles. A score is a measurement under stated conditions: task set version, harness hash, and seed, all printed next to it.</p>
    <p>Full spec: see SPEC.md in the repository.</p>`;
}

function renderFaq() {
  const qa = [
    ['How do I run it?', 'Clone the repo, set your provider API key in the environment, and run one command: longrun run on any task in tasks/. The Docker image in harness/ packages the same thing.'],
    ['What does it cost me?', 'Your model API usage: a few cents to a few dollars per task at current prices. The benchmark charges nothing, and the org never pays for agent compute.'],
    ['Can I use a local model?', 'Yes. Point the OpenAI-compatible adapter at your local endpoint with the local/ model prefix.'],
    ['Why is my score lower than I expected?', 'Read the rubric breakdown on your score page. Most commonly: incomplete deliverables and claims the deterministic checks could not verify.'],
    ["Someone's score looks fake.", 'File a dispute on the score (it stakes 5 reputation) or reproduce it yourself. The score goes to the verification pool as priority, blind, and the protocol handles the rest.'],
    ['Do you sell scores?', 'No. Scores are never for sale. Phase 3 services are public and flat: vendor evaluations at $2,500 per level, priority verification where the fee passes through to the verifier who does the reproduction, and an enterprise API for score history and head-to-head comparisons. The full price list is on the pricing page. No price buys a score, a placement, or suppression of a generalization-gap flag.'],
    ['Can I suggest a task?', 'Yes: a PR against the task schema. New tasks must pass the validation sweep, including a scripted solver and a seen-to-fail control.'],
    ['Why three profiles?', 'Because a raw API and a finished product are different things, and comparing them is meaningless.'],
    ['What happens to my API key?', 'Nothing. It never leaves your machine: keys are read from the environment at call time, redacted from transcripts, and never part of an upload.'],
    ['Who runs this?', 'A GitHub org and a handful of maintainers. The spec, the harness, and the board are all public.'],
  ];
  app.innerHTML = '<h2>FAQ</h2>' + qa.map(([q, a]) => `<h3>${q}</h3><p>${a}</p>`).join('');
}

async function renderDisputes() {
  const data = await api('/api/disputes');
  const rows = data.disputes.map(d => `<tr><td>${d.id.slice(0, 8)}</td><td>${d.score_id.slice(0, 8)}</td><td>${d.status}</td><td>${d.reason || ''}</td><td>${d.resolution || ''}</td></tr>`).join('');
  app.innerHTML = `<h2>Disputes</h2>${data.disputes.length ? `<table><tr><th>Id</th><th>Score</th><th>Status</th><th>Reason</th><th>Resolution</th></tr>${rows}</table>` : '<p>No disputes on record.</p>'}`;
}

async function renderPricing() {
  const p = await api('/api/pricing');
  const evals = Object.entries(p.evaluations).filter(([k]) => k !== 'note')
    .map(([level, price]) => `<tr><td>Vendor evaluation, ${level}</td><td>$${price.toLocaleString()} flat</td></tr>`).join('');
  const never = p.never_for_sale.map(item => `<li>${item}</li>`).join('');
  app.innerHTML = `<h2>Pricing</h2>
    <p>The board is free to read and free to submit to. These are the Phase 3 paid services (SPEC §9). Prices are public and flat; there are no negotiated discounts, because a discount schedule is a pay-for-placement schedule waiting to happen.</p>
    <table><tr><th>Service</th><th>Price</th></tr>${evals}
    <tr><td>Priority verification</td><td>Fee set by the requester, paid in full to the verifier who completes the reproduction. The bench org takes no cut.</td></tr>
    <tr><td>Enterprise API</td><td>Key access to score history, CI data, and head-to-head comparisons.</td></tr></table>
    <h3>Never for sale</h3><ul>${never}</ul>
    <p class="meta">Orders are a public ledger: <code>GET /api/orders</code>. An order can pay for a service; it cannot create, alter, or suppress any score or flag.</p>`;
}

function renderSubmit() {
  app.innerHTML = `<h2>Submit a run</h2>
    <p>Everything runs on your machine: your agent, your API key. Run a task with the open harness (or drive your own agent through the protocol server), optionally grade it against the rubric with an LLM judge, then upload:</p>
    <pre>longrun run tasks/sprint/sprint-data-001 --model anthropic/claude-opus-5.5 --out runs/my-run
longrun grade --task tasks/sprint/sprint-data-001 --run-dir runs/my-run --judge-model anthropic/claude-opus-5.5
longrun upload --dir runs/my-run --api ${location.origin}</pre>
    <p>The server verifies the signature, replays the deterministic checks, and for graded claims recomputes the rubric caps and total from the declared judge scores before anything reaches the board. Scores start as provisional; the community rates them by reproduction: two independent reruns inside the confidence interval make a score verified, two outside make it disputed. Full walkthrough: docs/community-quickstart.md in the repository.</p>`;
}

async function route() {
  const hash = location.hash.slice(1) || '/';
  const [path, qs] = hash.split('?');
  const params = new URLSearchParams(qs || '');
  try {
    if (path === '/' || path === '') await renderBoard(params);
    else if (path.startsWith('/score/')) await renderScore(path.split('/')[2]);
    else if (path === '/tasks') await renderTasks();
    else if (path === '/methodology') renderMethodology();
    else if (path === '/faq') renderFaq();
    else if (path === '/disputes') await renderDisputes();
    else if (path === '/pricing') await renderPricing();
    else if (path === '/submit') renderSubmit();
    else app.innerHTML = '<p>Not found.</p>';
  } catch (err) {
    app.innerHTML = '<p>Failed to load: ' + err.message + '</p>';
  }
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
